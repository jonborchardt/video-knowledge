name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, lint, format check, build dist/ from the committed topics/<topic>/report.json files, then test the build.
      - run: npm run validate
        env:
          DEPLOY_TARGET: pages # the GitHub Pages mirror under /video-knowledge/; Cloudflare builds the root site
      # Web-quality gate (.claude/skills/web-quality): known advisories in shipped dependencies, then real browsers
      # (reflow, keyboard, interactions in all three engines; axe, lab CLS, reduced motion in Chromium) against dist/.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
        env:
          DEPLOY_TARGET: pages
          WEB_QUALITY_BROWSERS: chromium,firefox,webkit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
