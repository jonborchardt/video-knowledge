    <path d="M-4 5-10 13-3 11Z" fill="#64748B"/>
    <path d="M4 5 10 13 3 11Z" fill="#64748B"/>
    <path d="M0-15C5-10 5.5 3 4.5 10H-4.5C-5.5 3-5-10 0-15Z" fill="#94A3B8"/>
    <circle cx="0" cy="-4" r="2.6" fill="#0B1120"/>
  </g>
</svg>
